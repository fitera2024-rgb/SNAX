name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: pip install -e ".[dev]"
      - run: pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q -m "not integration"
      - run: python scripts/validate_contracts.py
      - run: python scripts/validate_manifest.py
      # The first-party editable distribution is not published on PyPI; audit all
      # resolved third-party packages and fail on any known vulnerability.
      - run: pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait postgres
      - run: docker compose run --rm --no-deps api alembic upgrade 20260818_0001
      - run: docker compose run --rm --no-deps api alembic upgrade head
      - run: docker compose run --rm --no-deps api alembic downgrade 20260818_0001
      - run: docker compose run --rm --no-deps api alembic upgrade head
      - run: docker compose run --rm --no-deps api alembic downgrade base
      - run: docker compose run --rm --no-deps api alembic upgrade head
      - if: always()
        run: docker compose logs --no-color postgres
      - if: always()
        run: docker compose down -v
  outbox-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: docker compose up -d --build --wait postgres minio
      - run: docker compose run --rm --no-deps api alembic upgrade head
      - run: docker compose run --rm --no-deps api python scripts/prepare_storage.py
      - name: PostgreSQL and MinIO integration tests
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://snax:snax@localhost:5432/snax
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: snax-local
          S3_SECRET_KEY: snax-local-password
          S3_BUCKET: snax-imports
          PROCESSING_AUTOSTART: "false"
          PROCESSOR_MODE: disabled
          TEST_DATABASE_URL: postgresql+psycopg://snax:snax@localhost:5432/snax
          TEST_S3_ENDPOINT: http://localhost:9000
          TEST_S3_ACCESS_KEY: snax-local
          TEST_S3_SECRET_KEY: snax-local-password
          TEST_S3_BUCKET: snax-imports
        run: pytest -q -m integration
      - if: always()
        run: docker compose logs --no-color postgres minio
      - if: always()
        run: docker compose down -v
  queue-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: docker compose up -d --build --wait postgres redis minio
      - run: docker compose run --rm --no-deps api alembic upgrade head
      - run: docker compose run --rm --no-deps api python scripts/prepare_storage.py
      - run: docker compose up -d --wait api worker outbox-dispatcher recovery-sweeper
      - name: Live Redis/Celery queue smoke and duplicate delivery
        env:
          QUEUE_BROKER_URL: redis://localhost:6379/0
          REDIS_URL: redis://localhost:6379/0
          SMOKE_DATABASE_URL: postgresql+psycopg://snax:snax@localhost:5432/snax
        run: python scripts/queue_smoke_test.py
      - name: Live retry, heartbeat, dead-letter, stale recovery and redispatch
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://snax:snax@localhost:5432/snax
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: snax-local
          S3_SECRET_KEY: snax-local-password
          S3_BUCKET: snax-imports
          QUEUE_BROKER_URL: redis://localhost:6379/0
          REDIS_URL: redis://localhost:6379/0
          PROCESSING_AUTOSTART: "false"
          PROCESSOR_MODE: source-integrity-test
        run: python scripts/queue_resilience_test.py
      - run: >-
          docker compose exec -T worker
          celery -A snax_import.adapters.queue.celery_app:celery_app inspect ping --timeout=5
      - if: always()
        run: docker compose logs --no-color api worker outbox-dispatcher recovery-sweeper redis
      - if: always()
        run: docker compose down -v
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: docker compose config
      - run: docker compose build
      - run: docker compose up -d --wait postgres redis minio
      - run: docker compose run --rm --no-deps api alembic upgrade head
      - run: docker compose run --rm --no-deps api python scripts/prepare_storage.py
      - run: docker compose up -d --wait api worker outbox-dispatcher recovery-sweeper web
      - run: python scripts/smoke_test.py
      - name: Queue smoke
        env:
          QUEUE_BROKER_URL: redis://localhost:6379/0
          REDIS_URL: redis://localhost:6379/0
          SMOKE_DATABASE_URL: postgresql+psycopg://snax:snax@localhost:5432/snax
        run: python scripts/queue_smoke_test.py
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v


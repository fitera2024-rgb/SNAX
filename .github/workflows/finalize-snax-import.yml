name: Finalize SNAX project import

on:
  push:
    branches:
      - feature/hybrid-import-receiving-v2.1
    paths:
      - .github/workflows/finalize-snax-import.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/hybrid-import-receiving-v2.1
          fetch-depth: 0

      - name: Normalize project naming, restore index and rebuild manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import subprocess
          from pathlib import Path

          root = Path('.')
          workflow = Path('.github/workflows/finalize-snax-import.yml')

          explicit_files = {
              Path('.env.example'),
              Path('.gitignore'),
              Path('AGENTS.md'),
              Path('CODEX_INITIAL_PROMPT.md'),
              Path('DECISIONS_REQUIRED.md'),
              Path('README.md'),
          }
          roots = [Path('adr'), Path('contracts'), Path('profiles'), Path('tasks')]

          candidates: set[Path] = set(explicit_files)
          for base in roots:
              if base.exists():
                  candidates.update(path for path in base.rglob('*') if path.is_file())
          docs = Path('docs')
          if docs.exists():
              candidates.update(
                  path
                  for path in docs.rglob('*')
                  if path.is_file()
                  and not path.is_relative_to(Path('docs/etalon'))
                  and path.suffix.lower() not in {'.png', '.jpg', '.jpeg', '.webp', '.gif', '.pdf', '.docx'}
              )

          for path in sorted(candidates):
              if not path.exists() or path.name == 'MANIFEST.sha256':
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text.replace('SNAK', 'SNAX').replace('snak', 'snax')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          etalon_section = '''\n## Эталонные материалы\n\n- [Категорийный менеджер и склад — эталонный комплект от 12.08.2026](docs/etalon/category-manager-warehouse/2026-08-12/README.md)\n- [Финансовый директор — эталонный комплект v1.1 от 13.08.2026](docs/etalon/financial-director/2026-08-13/README.md)\n- [Финансовый директор — объединённый отчёт v1.2 по видео и транскрибации от 13.08.2026](docs/etalon/financial-director/2026-08-13-v1.2/README.md)\n\nВ каталогах эталонов сохраняются утверждённые структуры документов, уровни доказательности, контрольные суммы исходных материалов и ссылки на неизменённые редакции. Новые версии не перезаписывают предыдущие.\n'''
          marker = '\n## Главные документы\n'
          if '## Эталонные материалы' not in text:
              if marker not in text:
                  raise SystemExit('README marker for etalon section was not found')
              text = text.replace(marker, etalon_section + marker, 1)
          readme.write_text(text, encoding='utf-8')

          gitignore = Path('.gitignore')
          text = gitignore.read_text(encoding='utf-8')
          ignore_rule = '*_Codex_Project_Pack_*.zip'
          if ignore_rule not in text:
              text = text.rstrip() + '\n\n# Generated project packs\n' + ignore_rule + '\n'
          gitignore.write_text(text, encoding='utf-8')

          for archive in root.glob('*Codex_Project_Pack_*.zip'):
              archive.unlink()

          # The workflow is intentionally one-shot and removes itself from the final tree.
          if workflow.exists():
              workflow.unlink()

          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          manifest_lines: list[str] = []
          for item in sorted(tracked):
              path = Path(item)
              if item == 'MANIFEST.sha256':
                  continue
              if item.startswith('docs/etalon/'):
                  continue
              if item == workflow.as_posix():
                  continue
              if item.endswith('.zip') and 'Codex_Project_Pack_' in item:
                  continue
              if not path.is_file():
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              manifest_lines.append(f'{digest}  {item}')
          Path('MANIFEST.sha256').write_text('\n'.join(manifest_lines) + '\n', encoding='utf-8')

          remaining: list[str] = []
          for path in sorted(candidates):
              if not path.exists() or path.name == 'MANIFEST.sha256':
                  continue
              try:
                  value = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if 'SNAK' in value or 'snak' in value:
                  remaining.append(path.as_posix())
          if remaining:
              raise SystemExit('Old project naming remains in: ' + ', '.join(remaining))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: finalize SNAX project structure import"
          git push origin HEAD:feature/hybrid-import-receiving-v2.1

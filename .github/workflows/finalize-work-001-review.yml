name: Finalize WORK-001 review fixes

on:
  push:
    branches:
      - work/001-web-bootstrap-impl

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: work/001-web-bootstrap-impl
          fetch-depth: 0

      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          task = Path("tasks/WORK-001-web-bootstrap.md")
          task_text = task.read_text(encoding="utf-8")
          replaced = False
          for old in (
              "| Статус | `READY_FOR_CODEX_CLOUD` |",
              "| Статус | `REVIEW` |",
              "| Статус | `READY_TO_MERGE` |",
          ):
              if old in task_text:
                  task_text = task_text.replace(old, "| Статус | `DONE` |", 1)
                  replaced = True
                  break
          if not replaced and "| Статус | `DONE` |" not in task_text:
              raise SystemExit("WORK-001 status row was not found")
          task.write_text(task_text, encoding="utf-8")

          compose = Path("docker-compose.yml")
          compose_text = compose.read_text(encoding="utf-8")
          compose_text = compose_text.replace(
              "image: minio/minio:latest",
              "image: minio/minio:RELEASE.2025-09-07T16-13-09Z",
          )
          marker = "    command: server /data --console-address :9001\n"
          ports = '    ports:\n      - "9000:9000"\n      - "9001:9001"\n'
          if '      - "9001:9001"' not in compose_text:
              if marker not in compose_text:
                  raise SystemExit("MinIO command marker was not found")
              compose_text = compose_text.replace(marker, marker + ports, 1)
          compose.write_text(compose_text, encoding="utf-8")

          manifest = Path("MANIFEST.sha256")
          lines: list[str] = []
          for line in manifest.read_text(encoding="utf-8").splitlines():
              if "  " not in line:
                  lines.append(line)
                  continue
              _, relative = line.split("  ", 1)
              if relative in {".gitignore", "README.md"}:
                  digest = hashlib.sha256(Path(relative).read_bytes()).hexdigest()
                  line = f"{digest}  {relative}"
              lines.append(line)
          manifest.write_text("\n".join(lines) + "\n", encoding="utf-8")

          workflow = Path(".github/workflows/finalize-work-001-review.yml")
          workflow.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: apply WORK-001 review fixes"
          git push origin HEAD:work/001-web-bootstrap-impl

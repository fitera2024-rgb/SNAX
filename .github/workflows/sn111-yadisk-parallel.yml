name: SN111 parallel media processing

on:
  push:
    branches:
      - automation/sn111-training-pack-20260901
    paths:
      - .github/workflows/sn111-yadisk-parallel.yml

permissions:
  contents: read

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUBLIC_KEY: https://disk.yandex.ru/d/-yUlF0K-Ot1ZoA
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "Pillow>=10,<12"
      - name: Download and normalize all photos
        run: |
          python - <<'PY'
          import json, os, re, shutil, time, unicodedata, urllib.parse, urllib.request
          from pathlib import Path
          from PIL import Image, ImageOps

          public_key = os.environ["PUBLIC_KEY"]
          meta_api = "https://cloud-api.yandex.net/v1/disk/public/resources"
          download_api = "https://cloud-api.yandex.net/v1/disk/public/resources/download"
          output = Path("sn111_parallel/photos")
          work = Path("sn111_parallel/photo_work")
          output.mkdir(parents=True, exist_ok=True)
          work.mkdir(parents=True, exist_ok=True)

          def request_json(base, params):
              url = base + "?" + urllib.parse.urlencode(params)
              last = None
              for attempt in range(6):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "SN111-photo-processor/1.0"})
                      with urllib.request.urlopen(req, timeout=90) as response:
                          return json.load(response)
                  except Exception as exc:
                      last = exc
                      time.sleep(min(60, 2 ** attempt))
              raise RuntimeError(last)

          def normalize(path):
              if path.startswith("disk:"):
                  path = path[5:]
              return path if path.startswith("/") else "/" + path

          items, seen = [], set()
          def walk(path="/"):
              path = normalize(path)
              if path in seen:
                  return
              seen.add(path)
              offset = 0
              while True:
                  data = request_json(meta_api, {"public_key": public_key, "path": path, "limit": 1000, "offset": offset, "sort": "name"})
                  embedded = data.get("_embedded") or {}
                  batch = embedded.get("items") or []
                  for raw in batch:
                      item = dict(raw)
                      item["path"] = normalize(raw.get("path") or path.rstrip("/") + "/" + (raw.get("name") or ""))
                      items.append(item)
                      if item.get("type") == "dir":
                          walk(item["path"])
                  offset += len(batch)
                  if not batch or offset >= embedded.get("total", len(batch)):
                      break
          walk()
          images = sorted([i for i in items if i.get("type") == "file" and (i.get("mime_type") or "").startswith("image/")], key=lambda i: (i.get("name") or "").casefold())

          def safe(value):
              value = unicodedata.normalize("NFC", value)
              value = re.sub(r'[\\/:*?"<>|]+', '_', value)
              return re.sub(r'\s+', ' ', value).strip(' ._')[:105] or 'photo'

          def download(item, destination):
              partial = destination.with_suffix(destination.suffix + ".part")
              last = None
              for attempt in range(6):
                  try:
                      partial.unlink(missing_ok=True)
                      href = request_json(download_api, {"public_key": public_key, "path": item["path"]})["href"]
                      req = urllib.request.Request(href, headers={"User-Agent": "SN111-photo-processor/1.0"})
                      with urllib.request.urlopen(req, timeout=180) as response, partial.open("wb") as stream:
                          shutil.copyfileobj(response, stream, length=1024 * 1024)
                      expected = int(item.get("size") or 0)
                      if expected and partial.stat().st_size != expected:
                          raise OSError(f"size mismatch {partial.stat().st_size} != {expected}")
                      partial.replace(destination)
                      return
                  except Exception as exc:
                      last = exc
                      time.sleep(min(90, 3 * 2 ** attempt))
              raise RuntimeError(last)

          index = []
          failures = []
          for number, item in enumerate(images, 1):
              name = item.get("name") or Path(item["path"]).name
              source = work / f"P{number:03d}{Path(name).suffix or '.jpg'}"
              destination = output / f"P{number:03d}_{safe(Path(name).stem)}.jpg"
              try:
                  print(f"PHOTO {number}/{len(images)} {item['path']}", flush=True)
                  download(item, source)
                  with Image.open(source) as image:
                      image = ImageOps.exif_transpose(image).convert("RGB")
                      image.thumbnail((2200, 2200), Image.Resampling.LANCZOS)
                      image.save(destination, "JPEG", quality=90, optimize=True, progressive=True)
                      width, height = image.size
                  index.append({"id": f"P{number:03d}", "source_path": item["path"], "source_name": name, "output_name": destination.name, "width": width, "height": height})
              except Exception as exc:
                  failures.append({"path": item["path"], "error": repr(exc)})
              finally:
                  source.unlink(missing_ok=True)
          (output / "photo_index.json").write_text(json.dumps(index, ensure_ascii=False, indent=2), encoding="utf-8")
          (output / "failures.json").write_text(json.dumps(failures, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"DONE photos: {len(index)} ok, {len(failures)} failed", flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sn111-parallel-photos
          path: sn111_parallel/photos
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        group: [0, 1, 2, 3, 4, 5]
    env:
      PUBLIC_KEY: https://disk.yandex.ru/d/-yUlF0K-Ot1ZoA
      GROUP: ${{ matrix.group }}
      GROUPS: "6"
      WHISPER_MODEL: small
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "faster-whisper>=1.1,<2" "Pillow>=10,<12"
      - name: Process assigned videos
        run: python scripts/sn111_parallel_process.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sn111-parallel-video-${{ matrix.group }}
          path: sn111_parallel/group_${{ matrix.group }}
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://snax:snax@postgres:5432/snax
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: snax-imports
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio
  web:
    build: ./apps/web
    ports:
      - "8080:80"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: snax
      POSTGRES_USER: snax
      POSTGRES_PASSWORD: snax
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: snax-local
      MINIO_ROOT_PASSWORD: snax-local-password
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:

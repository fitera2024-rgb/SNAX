services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://snax:snax@postgres:5432/snax
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: snax-local
      S3_SECRET_KEY: snax-local-password
      S3_BUCKET: snax-imports
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      MAX_UPLOAD_BYTES: 104857600
      TEMP_DIRECTORY: /tmp/snax
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
  web:
    build: ./apps/web
    ports:
      - "8080:80"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: snax
      POSTGRES_USER: snax
      POSTGRES_PASSWORD: snax
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snax -d snax"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: snax-local
      MINIO_ROOT_PASSWORD: snax-local-password
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
